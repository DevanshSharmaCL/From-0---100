  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts</title>
    <link rel="stylesheet" href="Style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
  </head>
  <body>
    <main>
        <section>
            <div class="all-reel">
                <div class="reel">
                    <video autoplay loop muted src="./Videos/206294_small.mp4"></video>
                    <div class="bottom">
                        <div class="user">
                            <img src="https://images.unsplash.com/photo-1765572473920-22dd2cd44f5e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw5fHx8ZW58MHx8fHx8">
                            <h4>Cyber</h4>
                            <button>Follow</button>
                        </div>
                        <h3>Let’s get ready with Royal Enfield gear</h3>
                    </div>
                    <div class="right">
                        <div class="like">
                            <h4 class="like-icon"><i class="ri-heart-3-line"></i></h4>
                            <h6>200</h6>
                        </div>
                        <div class="comment">
                            <h4 class="comment"><i class="ri-chat-4-line"></i></h4>
                            <h6>70</h6>
                        </div>
                        <div class="share">
                            <h4 class="share-icon"><i class="ri-share-forward-line"></i></h4>
                            <h6>213</h6>
                        </div>
                        <div class="menu">
                            <h4 class="menu-icon"><i class="ri-more-2-fill"></i></h4>
                            <h6>253</h6>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>
    <script src="script.js"></script> 
  </body>
  </html>
