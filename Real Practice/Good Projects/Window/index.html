<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="window-display">
            <div class="properties"></div>
            <div class="taskbar">
    <img class="window-start" src="https://img.icons8.com/color/48/windows-11.png"/>
</div>

<div class="window-start-ui">

    <div class="start-search">
        <input type="text" placeholder="Search apps..." id="searchInput">
    </div>

    <div class="apps-container">

        <div class="app">
            <img src="https://img.icons8.com/color/48/folder-invoices.png">
            <p>Explorer</p>
        </div>

        <div class="app">
            <img src="https://img.icons8.com/color/48/google-chrome.png">
            <p>Chrome</p>
        </div>

        <div class="app">
            <img src="https://img.icons8.com/color/48/calculator.png">
            <p>Calculator</p>
        </div>

        <div class="app">
            <img src="https://img.icons8.com/color/48/notepad.png">
            <p>Notepad</p>
        </div>

        <div class="app">
            <img src="https://img.icons8.com/color/48/settings.png">
            <p>Settings</p>
        </div>

        <div class="app">
            <img src="https://img.icons8.com/color/48/task-manager.png">
            <p>Task Manager</p>
        </div>

    </div>

</div>
        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
