<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Dribble.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <nav>
        <div class="nav-left">
          <div class="nav-left-dropdown">
            <i class="ri-menu-2-fill"></i>
          </div>
          <div class="nav-logo">
            <img
              src="png-transparent-design-community-dribbble-dribbbler-dribbble-logo-social-media-icon-removebg-preview.png"
            />
          </div>
        </div>

        <div class="nav-right">
          <div class="nav-right-icons">
            <i class="ri-chat-1-line"></i>
            <i class="ri-notification-3-line"></i>
          </div>
          <div class="nav-right-profile-container">
            <img src="2b941f8506da030101e15f413d177dc0.jpg" />
          </div>
        </div>
      </nav>

      <section>
        <div class="hero-container">
          <div class="hero-content-container">
            <div class="head-container">
              <h1>Discover The World's Top Designers</h1>
            </div>
            <div class="des-container">
              Explore work from the most talented and accomplished Designers
              ready to take on your next project
            </div>
            <div class="catorgory-container">
              <div class="shots">
                <i class="ri-image-2-line"></i>
                <span>Shots</span>
              </div>
              <div class="designers">
                <i class="ri-group-fill"></i>
                <span>Designers</span>
              </div>
              <div class="service">
                <i class="ri-todo-line"></i>
                <span>Service</span>
              </div>
            </div>
            <div class="search-bar">
              <form>
                <i class="ri-search-line"></i>
                <input
                  type="text"
                  id="search-input"
                  name="q"
                  placeholder="Search the site..."
                />
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
